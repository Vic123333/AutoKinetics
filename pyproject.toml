[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "autokinetics"
version = "2.0.0"
description = "Chemical reaction network simulator with a C++/Cython kinetics and numerics core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.10",
  "pyyaml>=6",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "cantera>=3.0", "Cython>=3.0"]

[project.scripts]
autokinetics = "autokinetics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autokinetics = ["library/*.yaml", "library/*.json", "static/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "network: tests that call external web APIs (deselect with -m 'not network')",
  "slow: long-running validation tests",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
