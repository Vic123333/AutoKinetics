name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python dependencies and C++/Cython build
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python setup.py build_ext --inplace
      - name: Lint
        run: ruff check src tests
      - name: Python tests (physics, numerics, API)
        run: pytest -m "not network" -q
      - name: Frontend unit tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npm run build
      - name: End-to-end tests (Playwright)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          PYTHON=python npx playwright test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t autokinetics:ci .
