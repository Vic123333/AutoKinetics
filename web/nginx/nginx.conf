# AutoKinetics – Nginx reverse proxy
# Replace 'example.com' with your actual domain.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide version banner
    server_tokens off;

    # Efficient file sending
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Request limits  (DoS mitigation)
    client_max_body_size    256k;   # simulation payload is tiny
    client_body_timeout     10s;
    client_header_timeout   10s;
    keepalive_timeout       65;
    send_timeout            10s;

    # Rate limiting:  30 req/s per IP, burst 60
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_status 429;

    # Gzip compression
    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/plain application/json application/javascript text/css text/xml image/svg+xml;

    # ── Upstream gunicorn ───────────────────────────────────────────────────
    upstream django {
        server app:8000;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name example.com www.example.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name example.com www.example.com;

        # TLS (replace with your cert paths or use certbot/acme.sh)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"     always;
        # CSP: only self + the CDNs used in the frontend
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.plot.ly 'unsafe-inline'; style-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; img-src * data:; connect-src 'self';"
            always;

        # ── Static files (served by whitenoise via Django, but cached by nginx) ──
        location /static/ {
            proxy_pass http://django;
            proxy_cache_valid 200 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── API – rate-limited ──────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 35s;   # slightly above SIMULATION_TIMEOUT_S
        }

        # ── Frontend ──────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
